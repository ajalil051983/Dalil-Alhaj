# Suppress Kotlin metadata warnings
-dontwarn kotlin.**
-dontwarn kotlinx.**
-ignorewarnings

# Keep Kotlin metadata
-keep class kotlin.Metadata { *; }
-keep class kotlin.** { *; }
-keep class kotlinx.** { *; }

# Keep serialization classes
-keep class kotlinx.serialization.** { *; }
-keepclassmembers class kotlinx.serialization.** { *; }

# Keep Android X classes
-keep class androidx.** { *; }
-keepclassmembers class androidx.** { *; }

# Keep Microsoft MAUI runtime classes
-keep class com.microsoft.maui.** { *; }
-keepclassmembers class com.microsoft.maui.** { *; }
-keep class com.microsoft.** { *; }
-keepclassmembers class com.microsoft.** { *; }

# Keep MAUI Android platform classes
-keep class mono.** { *; }
-keepclassmembers class mono.** { *; }
-keep class crc64** { *; }
-keepclassmembers class crc64** { *; }
