# ============================================================
# R8 / ProGuard configuration for Zad Alhaj (.NET MAUI)
# Minimal keep rules — allow R8 to obfuscate everything else
# ============================================================

# Suppress warnings that don't affect the app
-dontwarn kotlin.**
-dontwarn kotlinx.**
-ignorewarnings

# --- .NET MAUI / Mono runtime (required for app to start) ---
-keep class mono.MonoRuntimeProvider { *; }
-keep class mono.MonoPackageManager { *; }
-keep class mono.MonoPackageManager_Resources { *; }
-keep class mono.android.** { *; }

# Keep MAUI platform entry points
-keep class crc64** { *; }
-keep class com.microsoft.maui.PlatformInterop { *; }
-keep class com.microsoft.maui.MauiViewGroup { *; }

# --- AndroidX (keep only public API used by MAUI) ---
-keep class androidx.appcompat.app.AppCompatDelegate { *; }
-keep class androidx.core.app.** { *; }
-keep class androidx.lifecycle.** { *; }
-keep class androidx.fragment.app.** { *; }
-keep class androidx.navigation.** { *; }
-keep class androidx.localbroadcastmanager.** { *; }

# --- Kotlin metadata (needed for AndroidX interop) ---
-keep class kotlin.Metadata { *; }

# --- Local Notifications plugin ---
-keep class plugin.localnotification.** { *; }

# --- Android entry point ---
-keep public class * extends android.app.Application
-keep public class * extends android.app.Activity
-keep public class * extends android.app.Service
-keep public class * extends android.content.BroadcastReceiver
-keep public class * extends android.content.ContentProvider

# --- Optimization ---
-optimizationpasses 5
-allowaccessmodification
-repackageclasses ''
